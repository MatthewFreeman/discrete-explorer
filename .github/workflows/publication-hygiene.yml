name: Publication hygiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_REF: ${{ github.head_ref || github.ref_name }}
      PUBLICATION_TITLE: ${{ github.event.pull_request.title }}
      PUBLICATION_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-publication.cjs
      - run: node --test tests/publication.test.cjs
